# Publishes a GitHub Release when a semver tag is pushed.
#
# Cutting a release is a two-step, human-initiated process — see RELEASING.md:
#   1. Land a commit on `main` that bumps `version` in package.json and moves
#      the CHANGELOG "Unreleased" section under the new version heading.
#   2. Push the matching tag:  git tag v2.0.0 && git push origin v2.0.0
#
# This workflow refuses to publish if the tag and package.json disagree, so a
# release can never claim a version the tree does not actually contain.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: write

env:
  NODE_VERSION: '22.22'
  PNPM_VERSION: '10'

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # A tag that disagrees with package.json would ship release notes for a
      # version nobody can reproduce from the tree. Fail loudly instead.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump package.json on main, then re-tag."
            exit 1
          fi

      # Release notes come from the CHANGELOG section for this version, so the
      # notes people read on the Releases page are the same ones in the repo.
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/changelog-section.mjs "$VERSION" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for $VERSION."
            exit 1
          fi
          echo "--- release notes ---"
          cat release-notes.md

      # A release is a "use this exact commit" promise. Prove it builds clean
      # before publishing, not after someone reports it doesn't.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy USWDS assets
        run: node scripts/setup-uswds.mjs

      - name: TypeScript check
        run: pnpm check

      - name: Build site
        run: pnpm build

      - name: Package starter source
        run: |
          git archive --format=tar.gz --prefix="astro-gov-starter-${GITHUB_REF_NAME}/" \
            -o "astro-gov-starter-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_REF_NAME"

      # Uses the gh CLI pre-installed on GitHub runners rather than a
      # third-party action, so publishing a release pulls in no external
      # supply-chain dependency.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $PRERELEASE \
            "astro-gov-starter-${GITHUB_REF_NAME}.tar.gz"
